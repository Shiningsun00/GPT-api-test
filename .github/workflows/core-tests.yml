name: Core tests

on:
  push:
    branches:
      - step1-core-engine
      - step2-sqlite-persistence
      - step3-langgraph-state-machine
      - step4-career-workflow-migration
      - step5-fastapi-backend
      - step6-react-local-ui
      - step7-discord-integration
      - step8-notion-interaction
      - step9-desktop-qa
      - uat-generic-runtime-recovery
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile package
        run: python -m compileall -q src tests scripts
      - name: Run unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Run STEP 3 smoke test
        run: python scripts/manual_smoke_test.py --auto
      - name: Run R2 generic runtime smoke test
        run: python scripts/manual_generic_runtime_smoke_test.py
      - name: Run STEP 4 career smoke test
        run: python scripts/manual_career_smoke_test.py
      - name: Run STEP 5 API smoke test
        run: python scripts/manual_api_smoke_test.py
      - name: Run STEP 7 Discord adapter smoke test
        run: python scripts/manual_discord_smoke_test.py
      - name: Run STEP 8 Notion adapter smoke test
        run: python scripts/manual_notion_smoke_test.py
      - name: Run STEP 9 maintenance smoke test
        run: python scripts/manual_step9_smoke_test.py
      - name: Run final acceptance 1-19
        run: python scripts/manual_final_acceptance_test.py

  local-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies
        run: npm install
      - name: Run UI tests
        run: npm test
      - name: Build production UI
        run: npm run build
