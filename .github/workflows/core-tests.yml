name: Core tests

on:
  push:
    branches:
      - step1-core-engine
      - step2-sqlite-persistence
      - step3-langgraph-state-machine
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile package
        run: python -m compileall -q src tests scripts
      - name: Run unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Run STEP 3 smoke test
        run: python scripts/manual_smoke_test.py --auto
